<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile - AgroMind</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #faf7f0; color: #0e1f08; padding: 40px; }
        .card { max-width: 520px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
        label { display:block; margin-bottom:8px; font-weight:600; }
        input[type=text] { width:100%; padding:12px 14px; border:1px solid #e6e6e6; border-radius:8px; margin-bottom:12px; }
        .btn { background: #2d5a1b; color: #fff; padding:10px 14px; border-radius:8px; border:none; cursor:pointer; }
        .error { color:#b91c1c; margin-bottom:12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Profile</h2>
        <p>Update your username.</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username }}" required minlength="3" />

            <div style="margin-top:18px; display:flex; gap:16px; align-items:flex-start;">
                <!-- Image gallery -->
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <div class="thumb" data-index="0" title="Profile picture">
                        <img src="https://picsum.photos/seed/p1/240/160" alt="Profile 1" />
                    </div>
                    <div class="thumb" data-index="1" id="second-thumb" title="Hover for details">
                        <img src="https://picsum.photos/seed/p2/240/160" alt="Profile 2" />
                        <div class="thumb-overlay" id="second-overlay">
                            <div class="overlay-title">Farm field overview</div>
                            <div class="overlay-desc">Captured: 2026-05-01 — Soil moisture low</div>
                        </div>
                    </div>
                </div>

                <!-- Options for selected image -->
                <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <div style="font-weight:700; color:#2d5a1b;">Selected image actions</div>
                    <div id="selected-info" style="color:#4b5b3d; font-size:0.92rem;">Hover the second image to view details. Click an option below to act.</div>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <button class="btn" type="button" id="download-btn">Download</button>
                        <button class="btn" type="button" id="set-avatar-btn">Set as avatar</button>
                        <button class="btn" type="button" id="remove-btn">Remove</button>
                    </div>
                    <div style="margin-top:12px;">
                        <a href="/chat" style="color:#2d5a1b; text-decoration:none;">Back to chat</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <style>
        .thumb { width:240px; height:160px; border-radius:10px; overflow:hidden; border:1px solid #e6e6e6; }
        .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
        .thumb { position:relative; }
        .thumb-overlay {
            position:absolute; left:0; right:0; bottom:0; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
            color:#fff; padding:10px; transform: translateY(100%); transition: transform 0.18s ease; font-size:0.9rem;
        }
        .thumb:hover .thumb-overlay { transform: translateY(0%); }
        .overlay-title { font-weight:700; }
        .overlay-desc { font-size:0.82rem; opacity:0.9; margin-top:4px; }
    </style>

    <script>
        (function(){
            const secondThumb = document.getElementById('second-thumb');
            const downloadBtn = document.getElementById('download-btn');
            const setAvatarBtn = document.getElementById('set-avatar-btn');
            const removeBtn = document.getElementById('remove-btn');
            const selectedInfo = document.getElementById('selected-info');

            // track currently selected image element
            let selectedImg = secondThumb.querySelector('img');

            // expose overlay details on hover (already handled via CSS). Update selected info on hover
            secondThumb.addEventListener('mouseenter', () => {
                selectedImg = secondThumb.querySelector('img');
                selectedInfo.textContent = 'Image: Farm field overview — Captured: 2026-05-01';
            });
            secondThumb.addEventListener('mouseleave', () => {
                selectedInfo.textContent = 'Hover the second image to view details. Click an option below to act.';
            });

            // Download current selected image
            downloadBtn.addEventListener('click', () => {
                if (!selectedImg) return alert('No image selected');
                const url = selectedImg.src;
                // Create an anchor and trigger download
                const a = document.createElement('a');
                a.href = url;
                a.download = 'image.jpg';
                document.body.appendChild(a);
                a.click();
                a.remove();
            });

            // Set as avatar (simple visual feedback)
            setAvatarBtn.addEventListener('click', () => {
                if (!selectedImg) return alert('No image selected');
                alert('Set as avatar: ' + selectedImg.src);
            });

            // Remove image from UI
            removeBtn.addEventListener('click', () => {
                if (!selectedImg) return alert('No image selected');
                if (!confirm('Remove this image from your profile?')) return;
                selectedImg.parentElement.remove();
                selectedImg = null;
                selectedInfo.textContent = 'Image removed.';
            });
        })();
    </script>
</body>
</html>
